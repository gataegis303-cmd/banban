[project]
name = "banban-backend"
version = "0.1.0"
description = "BanBan 后端 API — 交友/搭伴平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "redis[hiredis]>=5.1.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib==1.7.4",
    "bcrypt<4.1",
    "python-multipart>=0.0.12",
    "httpx[http2]>=0.27.0",
    "oss2>=2.19.0",
    "alibabacloud-dysmsapi20170525>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions"]  # autogenerate 产物，不做 lint

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
