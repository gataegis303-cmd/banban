#  BanBan Nginx 配置
#  反向代理 API + WebSocket（/ws 路径带 Upgrade 头）

upstream banban_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # 请求体上限：照片直传 OSS 后此值只需覆盖普通 JSON
    client_max_body_size 10m;

    # ── 健康检查（供负载均衡/容器探针直连）───────────────────
    location = /health {
        proxy_pass http://banban_api/api/v1/health;
        proxy_set_header Host $host;
    }

    # ── WebSocket（WSS 终止在 Nginx TLS 层，此处为内网 HTTP）────
    location /ws {
        proxy_pass http://banban_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 3600s;  # 长连接保活 1h
        proxy_send_timeout 3600s;
    }

    # ── REST API ──────────────────────────────────────────────
    location / {
        proxy_pass http://banban_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }
}

