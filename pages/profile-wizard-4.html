<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>资料创建 · 照片</title>
    <style id="theme-vars">
/* BanBan Design Tokens — 不婚者异性搭伴生活中介平台 */

:root {
  /* Brand primary — Apple System Blue */
  --banban-primary-50: #e8f2ff;
  --banban-primary-100: #cfe5ff;
  --banban-primary-200: #9fcbff;
  --banban-primary-300: #66abff;
  --banban-primary-400: #2e8dff;
  --banban-primary-500: #007aff;
  --banban-primary-600: #0064d6;
  --banban-primary-700: #004fad;
  --banban-primary-800: #003b82;
  --banban-primary-900: #00275a;
  --banban-primary-950: #001c40;

  /* Neutral scale — iOS system grays */
  --banban-neutral-0: #ffffff;
  --banban-neutral-50: #f7f7fa;
  --banban-neutral-100: #f2f2f7;
  --banban-neutral-200: #e5e5ea;
  --banban-neutral-300: #d1d1d6;
  --banban-neutral-400: #aeaeb2;
  --banban-neutral-500: #8e8e93;
  --banban-neutral-600: #6e6e73;
  --banban-neutral-700: #48484a;
  --banban-neutral-800: #2c2c2e;
  --banban-neutral-900: #1d1d1f;
  --banban-neutral-950: #0a0a0c;

  /* Semantic states — Apple system colors */
  --banban-success: #34c759;
  --banban-success-foreground: #ffffff;
  --banban-success-subtle: #e9f9ee;
  --banban-warning: #ff9500;
  --banban-warning-foreground: #1d1d1f;
  --banban-warning-subtle: #fff2e0;
  --banban-error: #ff3b30;
  --banban-error-foreground: #ffffff;
  --banban-error-subtle: #ffecea;
  --banban-info: #007aff;
  --banban-info-foreground: #ffffff;
  --banban-info-subtle: #e8f2ff;

  /* Semantic aliases — light mode */
  --banban-background: var(--banban-neutral-0);
  --banban-foreground: var(--banban-neutral-900);
  --banban-card: var(--banban-neutral-0);
  --banban-card-foreground: var(--banban-neutral-900);
  --banban-popover: var(--banban-neutral-0);
  --banban-popover-foreground: var(--banban-neutral-900);
  --banban-primary: var(--banban-primary-500);
  --banban-primary-foreground: var(--banban-neutral-0);
  --banban-muted: var(--banban-neutral-100);
  --banban-muted-foreground: var(--banban-neutral-500);
  --banban-border: var(--banban-neutral-200);
  --banban-input: var(--banban-neutral-300);
  --banban-ring: var(--banban-primary-500);

  /* Radius scale */
  --banban-radius-small: 4px;
  --banban-radius-medium: 8px;
  --banban-radius-large: 12px;
  --banban-radius-full: 9999px;

  /* Shadows — Apple hairline elevations (light); floating layers may be deeper */
  --banban-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 1px rgba(0, 0, 0, 0.03);
  --banban-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05);
  --banban-shadow-3: 0 24px 64px -12px rgba(0, 0, 0, 0.12);

  /* Typography */
  --banban-font-sans: -apple-system, BlinkMacSystemFont, "SF Pro", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --banban-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  /* iOS safe areas */
  --banban-safe-top: env(safe-area-inset-top, 0px);
  --banban-safe-bottom: env(safe-area-inset-bottom, 0px);
  --banban-safe-left: env(safe-area-inset-left, 0px);
  --banban-safe-right: env(safe-area-inset-right, 0px);
}

/* Dark mode — Apple system dark (default appearance) */
.dark {
  --banban-background: #000000;
  --banban-foreground: #f5f5f7;
  --banban-card: #1c1c1e;
  --banban-card-foreground: #f5f5f7;
  --banban-popover: #3a3a3c;
  --banban-popover-foreground: #f5f5f7;
  --banban-primary: var(--banban-primary-400);
  --banban-primary-foreground: #000000;
  --banban-muted: #1c1c1e;
  --banban-muted-foreground: #8e8e93;
  --banban-border: #3a3a3c;
  --banban-input: #3a3a3c;
  --banban-ring: var(--banban-primary-400);

  /* Status subtle backgrounds — dark-tuned tints (Apple system hues) */
  --banban-success-subtle: #142e1f;
  --banban-warning-subtle: #33230e;
  --banban-error-subtle: #331513;
  --banban-info-subtle: #0f2338;

  /* Elevated shadows for dark surfaces — Apple dark elevations */
  --banban-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.30);
  --banban-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --banban-shadow-3: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

/* Base typography classes */
.banban-text-display {
  font-family: var(--banban-font-sans);
  font-size: clamp(32px, 8vw, 48px);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.02em;
}

.banban-text-h1 {
  font-family: var(--banban-font-sans);
  font-size: clamp(24px, 6vw, 32px);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.015em;
}

.banban-text-h2 {
  font-family: var(--banban-font-sans);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
}

.banban-text-body {
  font-family: var(--banban-font-sans);
  font-size: 15px;
  font-weight: 400;
  line-height: 1.6;
}

.banban-text-body-large {
  font-family: var(--banban-font-sans);
  font-size: 17px;
  font-weight: 400;
  line-height: 1.55;
}

.banban-text-caption {
  font-family: var(--banban-font-sans);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.5;
}

.banban-text-label {
  font-family: var(--banban-font-sans);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--banban-background);
    --color-foreground: var(--banban-foreground);
    --color-card: var(--banban-card);
    --color-card-foreground: var(--banban-card-foreground);
    --color-popover: var(--banban-popover);
    --color-popover-foreground: var(--banban-popover-foreground);
    --color-primary: var(--banban-primary);
    --color-primary-foreground: var(--banban-primary-foreground);
    --color-muted: var(--banban-muted);
    --color-muted-foreground: var(--banban-muted-foreground);
    --color-border: var(--banban-border);
    --color-input: var(--banban-input);
    --color-ring: var(--banban-ring);
    --radius-sm: var(--banban-radius-small);
    --radius-md: var(--banban-radius-medium);
    --radius-lg: var(--banban-radius-large);
  }
  @layer base {
    body { background: var(--banban-background); color: var(--banban-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

<body class="min-h-screen bg-background font-sans antialiased">
  <main class="min-h-screen w-full px-6 pb-44 pt-8">
    <!-- Progress header -->
    <section class="mb-8" aria-label="进度">
      <div class="flex items-center justify-between mb-3">
        <span class="banban-text-caption text-muted-foreground">步骤 4/4</span>
        <span class="banban-text-caption text-primary">100%</span>
      </div>
      <div class="h-1.5 w-full overflow-hidden rounded-full bg-muted">
        <div class="h-full w-full rounded-full bg-primary"></div>
      </div>
    </section>

    <!-- 我可提供 -->
    <section class="mb-8" aria-label="我可提供">
      <h1 class="banban-text-h1 text-foreground">我可提供</h1>
      <p class="banban-text-body mt-1 text-muted-foreground">可多选，按分类勾选你能提供的资源与条件</p>

      <div class="mt-5 space-y-6" role="group" aria-label="我可提供分类选项">
        <!-- 出行工具 -->
        <div data-chip-group aria-label="出行工具">
          <p class="banban-text-caption mb-2 font-medium text-foreground">出行工具</p>
          <div class="flex flex-wrap items-center gap-2">
            <button type="button" data-dom-id="transport-none" data-chip-toggle data-exclusive aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              无
            </button>
            <button type="button" data-dom-id="transport-sedan" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              小车
            </button>
            <div data-dom-id="transport-sedan-qty" data-qty-for="transport-sedan" data-stepper class="bb-hidden flex items-center rounded-full border border-border bg-card px-1 py-0.5" aria-label="小车数量">
              <button type="button" data-step="-1" aria-label="减少小车数量" class="grid h-6 w-6 place-items-center rounded-full text-muted-foreground transition-colors hover:text-foreground">−</button>
              <span data-count class="w-6 text-center banban-text-body text-foreground">1</span>
              <button type="button" data-step="1" aria-label="增加小车数量" class="grid h-6 w-6 place-items-center rounded-full text-muted-foreground transition-colors hover:text-foreground">+</button>
            </div>
            <button type="button" data-dom-id="transport-ebike" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              电动车
            </button>
            <div data-dom-id="transport-ebike-qty" data-qty-for="transport-ebike" data-stepper class="bb-hidden flex items-center rounded-full border border-border bg-card px-1 py-0.5" aria-label="电动车数量">
              <button type="button" data-step="-1" aria-label="减少电动车数量" class="grid h-6 w-6 place-items-center rounded-full text-muted-foreground transition-colors hover:text-foreground">−</button>
              <span data-count class="w-6 text-center banban-text-body text-foreground">1</span>
              <button type="button" data-step="1" aria-label="增加电动车数量" class="grid h-6 w-6 place-items-center rounded-full text-muted-foreground transition-colors hover:text-foreground">+</button>
            </div>
            <button type="button" data-dom-id="transport-bike" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              自行车
            </button>
            <div data-dom-id="transport-bike-qty" data-qty-for="transport-bike" data-stepper class="bb-hidden flex items-center rounded-full border border-border bg-card px-1 py-0.5" aria-label="自行车数量">
              <button type="button" data-step="-1" aria-label="减少自行车数量" class="grid h-6 w-6 place-items-center rounded-full text-muted-foreground transition-colors hover:text-foreground">−</button>
              <span data-count class="w-6 text-center banban-text-body text-foreground">1</span>
              <button type="button" data-step="1" aria-label="增加自行车数量" class="grid h-6 w-6 place-items-center rounded-full text-muted-foreground transition-colors hover:text-foreground">+</button>
            </div>
            <button type="button" data-dom-id="transport-taxi" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              打车报销
            </button>
          </div>
          <div data-quota-for="transport-taxi" class="bb-hidden mt-2 flex items-center gap-2 rounded-xl border border-border bg-card px-3 py-2" aria-label="打车报销月额度">
            <span class="banban-text-caption shrink-0 text-muted-foreground">月额度</span>
            <input data-dom-id="transport-taxi-quota" type="text" inputmode="numeric" placeholder="¥" class="w-16 bg-transparent banban-text-body text-foreground placeholder:text-muted-foreground/60 focus:outline-none" />
            <span class="banban-text-caption shrink-0 text-muted-foreground">元 / 月</span>
          </div>
        </div>

        <!-- 居住情况 -->
        <div data-chip-group aria-label="居住情况">
          <p class="banban-text-caption mb-2 font-medium text-foreground">居住情况</p>
          <div class="flex flex-wrap gap-2">
            <button type="button" data-dom-id="housing-mortgage" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              在供房
            </button>
            <button type="button" data-dom-id="housing-owned" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              全款房
            </button>
            <button type="button" data-dom-id="housing-shared" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              合租房
            </button>
            <button type="button" data-dom-id="housing-rent" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              独租房
            </button>
          </div>
          <div data-dom-id="housing-unused-rooms" data-reveal-when-selected data-stepper data-min="0" class="bb-hidden mt-2 flex items-center justify-between gap-2 rounded-xl border border-border bg-card px-3 py-2" aria-label="可提供未使用房间数">
            <span class="banban-text-caption text-muted-foreground">可提供未使用房间数（可填 0）</span>
            <div class="flex items-center gap-1">
              <button type="button" data-step="-1" aria-label="减少可提供未使用房间数" class="grid h-6 w-6 place-items-center rounded-full text-muted-foreground transition-colors hover:text-foreground">−</button>
              <span data-count class="w-6 text-center banban-text-body text-foreground">0</span>
              <button type="button" data-step="1" aria-label="增加可提供未使用房间数" class="grid h-6 w-6 place-items-center rounded-full text-muted-foreground transition-colors hover:text-foreground">+</button>
            </div>
          </div>
        </div>

        <!-- 居住条件 -->
        <div data-chip-group aria-label="居住条件">
          <p class="banban-text-caption mb-2 font-medium text-foreground">居住条件</p>
          <div class="flex flex-wrap gap-2">
            <button type="button" data-dom-id="cond-commercial" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              商品房
            </button>
            <button type="button" data-dom-id="cond-villa" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              商业别墅
            </button>
            <button type="button" data-dom-id="cond-loft" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              Loft
            </button>
            <button type="button" data-dom-id="cond-village" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              村屋
            </button>
            <button type="button" data-dom-id="cond-basement" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              地下室
            </button>
            <button type="button" data-dom-id="cond-garden" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              私家花园
            </button>
            <button type="button" data-dom-id="cond-parking" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              固定车位
            </button>
          </div>
        </div>

        <!-- 资源 -->
        <div data-chip-group aria-label="资源">
          <p class="banban-text-caption mb-2 font-medium text-foreground">资源</p>
          <div class="flex flex-wrap gap-2">
            <button type="button" data-dom-id="provide-savings" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              存款
            </button>
            <button type="button" data-dom-id="provide-income" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              稳定收入
            </button>
            <button type="button" data-dom-id="provide-hukou" data-chip-toggle aria-pressed="false" class="rounded-full border border-border bg-card px-4 py-2 banban-text-body text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
              本地户口
            </button>

  <script>
    (function () {
      lucide.createIcons();
    })();

    // 我可提供 board: chip multi-select + exclusive 无 + steppers + group reveal row + taxi quota + tag input
    (function () {
      const CHIP_ON = ['bg-primary', 'text-primary-foreground'];
      const CHIP_OFF = ['bg-card', 'text-muted-foreground', 'hover:bg-muted', 'hover:text-foreground'];

      function setChip(chip, on) {
        chip.setAttribute('aria-pressed', on ? 'true' : 'false');
        (on ? CHIP_OFF : CHIP_ON).forEach(function (cls) { chip.classList.remove(cls); });
        (on ? CHIP_ON : CHIP_OFF).forEach(function (cls) { chip.classList.add(cls); });
        const qty = document.querySelector('[data-qty-for="' + chip.dataset.domId + '"]');
        if (qty) qty.classList.toggle('bb-hidden', !on);
        const quota = document.querySelector('[data-quota-for="' + chip.dataset.domId + '"]');
        if (quota) quota.classList.toggle('bb-hidden', !on);
        const group = chip.closest('[data-chip-group]');
        if (group) {
          const reveal = group.querySelector('[data-reveal-when-selected]');
          if (reveal) reveal.classList.toggle('bb-hidden', !group.querySelector('[data-chip-toggle][aria-pressed="true"]'));
        }
      }

      function switchChip(chip, on) {
        setChip(chip, on);
        const group = chip.closest('[data-chip-group]');
        if (!group || !on) return;
        if (chip.hasAttribute('data-exclusive')) {
          group.querySelectorAll('[data-chip-toggle][aria-pressed="true"]').forEach(function (other) {
            if (other !== chip) setChip(other, false);
          });
        } else {
          const none = group.querySelector('[data-exclusive][aria-pressed="true"]');
          if (none) setChip(none, false);
        }
      }

      document.querySelectorAll('[data-chip-toggle]').forEach(function (chip) {
        chip.addEventListener('click', function () {
          switchChip(chip, chip.getAttribute('aria-pressed') !== 'true');
        });
      });

      document.querySelectorAll('[data-stepper]').forEach(function (stepper) {
        const count = stepper.querySelector('[data-count]');
        const min = parseInt(stepper.getAttribute('data-min'), 10);
        stepper.addEventListener('click', function (event) {
          const btn = event.target.closest('[data-step]');
          if (!btn || !count) return;
          const value = parseInt(count.textContent, 10) || 0;
          count.textContent = String(Math.max(isNaN(min) ? 1 : min, value + parseInt(btn.getAttribute('data-step'), 10)));
        });
      });

      const otherInput = document.querySelector('[data-dom-id="provide-other-input"]');
      const otherAdd = document.querySelector('[data-dom-id="provide-other-add"]');
      const otherTags = document.querySelector('[data-dom-id="provide-other-tags"]');

      function addOtherTag() {
        if (!otherInput || !otherTags) return;
        const text = otherInput.value.trim().slice(0, 12);
        if (!text) return;
        otherInput.value = '';
        const exists = Array.from(otherTags.children).some(function (tag) {
          return tag.getAttribute('data-tag') === text;
        });
        if (exists) return;
        const tag = document.createElement('span');
        tag.setAttribute('data-tag', text);
        tag.className = 'inline-flex items-center gap-1 rounded-full bg-primary/10 px-3 py-1.5 banban-text-body text-primary';
        const label = document.createElement('span');
        label.textContent = text;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.setAttribute('aria-label', '删除标签 ' + text);
        remove.className = 'text-primary/70 transition-colors hover:text-primary';
        remove.textContent = '×';
        remove.addEventListener('click', function () { tag.remove(); });
        tag.appendChild(label);
        tag.appendChild(remove);
        otherTags.appendChild(tag);
        otherInput.focus();
      }

      if (otherAdd) otherAdd.addEventListener('click', addOtherTag);
      if (otherInput) {
        otherInput.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            addOtherTag();
          }
        });
      }
    })();
  </script>
