<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>资料创建 · 生活</title>
    <style id="theme-vars">
/* BanBan Design Tokens — 不婚者异性搭伴生活中介平台 */

:root {
  /* Brand primary — Apple System Blue */
  --banban-primary-50: #e8f2ff;
  --banban-primary-100: #cfe5ff;
  --banban-primary-200: #9fcbff;
  --banban-primary-300: #66abff;
  --banban-primary-400: #2e8dff;
  --banban-primary-500: #007aff;
  --banban-primary-600: #0064d6;
  --banban-primary-700: #004fad;
  --banban-primary-800: #003b82;
  --banban-primary-900: #00275a;
  --banban-primary-950: #001c40;

  /* Neutral scale — iOS system grays */
  --banban-neutral-0: #ffffff;
  --banban-neutral-50: #f7f7fa;
  --banban-neutral-100: #f2f2f7;
  --banban-neutral-200: #e5e5ea;
  --banban-neutral-300: #d1d1d6;
  --banban-neutral-400: #aeaeb2;
  --banban-neutral-500: #8e8e93;
  --banban-neutral-600: #6e6e73;
  --banban-neutral-700: #48484a;
  --banban-neutral-800: #2c2c2e;
  --banban-neutral-900: #1d1d1f;
  --banban-neutral-950: #0a0a0c;

  /* Semantic states — Apple system colors */
  --banban-success: #34c759;
  --banban-success-foreground: #ffffff;
  --banban-success-subtle: #e9f9ee;
  --banban-warning: #ff9500;
  --banban-warning-foreground: #1d1d1f;
  --banban-warning-subtle: #fff2e0;
  --banban-error: #ff3b30;
  --banban-error-foreground: #ffffff;
  --banban-error-subtle: #ffecea;
  --banban-info: #007aff;
  --banban-info-foreground: #ffffff;
  --banban-info-subtle: #e8f2ff;

  /* Semantic aliases — light mode */
  --banban-background: var(--banban-neutral-0);
  --banban-foreground: var(--banban-neutral-900);
  --banban-card: var(--banban-neutral-0);
  --banban-card-foreground: var(--banban-neutral-900);
  --banban-popover: var(--banban-neutral-0);
  --banban-popover-foreground: var(--banban-neutral-900);
  --banban-primary: var(--banban-primary-500);
  --banban-primary-foreground: var(--banban-neutral-0);
  --banban-muted: var(--banban-neutral-100);
  --banban-muted-foreground: var(--banban-neutral-500);
  --banban-border: var(--banban-neutral-200);
  --banban-input: var(--banban-neutral-300);
  --banban-ring: var(--banban-primary-500);

  /* Radius scale */
  --banban-radius-small: 4px;
  --banban-radius-medium: 8px;
  --banban-radius-large: 12px;
  --banban-radius-full: 9999px;

  /* Shadows — Apple hairline elevations (light); floating layers may be deeper */
  --banban-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 1px rgba(0, 0, 0, 0.03);
  --banban-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05);
  --banban-shadow-3: 0 24px 64px -12px rgba(0, 0, 0, 0.12);

  /* Typography */
  --banban-font-sans: -apple-system, BlinkMacSystemFont, "SF Pro", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --banban-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  /* iOS safe areas */
  --banban-safe-top: env(safe-area-inset-top, 0px);
  --banban-safe-bottom: env(safe-area-inset-bottom, 0px);
  --banban-safe-left: env(safe-area-inset-left, 0px);
  --banban-safe-right: env(safe-area-inset-right, 0px);
}

/* Dark mode — Apple system dark (default appearance) */
.dark {
  --banban-background: #000000;
  --banban-foreground: #f5f5f7;
  --banban-card: #1c1c1e;
  --banban-card-foreground: #f5f5f7;
  --banban-popover: #3a3a3c;
  --banban-popover-foreground: #f5f5f7;
  --banban-primary: var(--banban-primary-400);
  --banban-primary-foreground: #000000;
  --banban-muted: #1c1c1e;
  --banban-muted-foreground: #8e8e93;
  --banban-border: #3a3a3c;
  --banban-input: #3a3a3c;
  --banban-ring: var(--banban-primary-400);

  /* Status subtle backgrounds — dark-tuned tints (Apple system hues) */
  --banban-success-subtle: #142e1f;
  --banban-warning-subtle: #33230e;
  --banban-error-subtle: #331513;
  --banban-info-subtle: #0f2338;

  /* Elevated shadows for dark surfaces — Apple dark elevations */
  --banban-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.30);
  --banban-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --banban-shadow-3: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

/* Base typography classes */
.banban-text-display {
  font-family: var(--banban-font-sans);
  font-size: clamp(32px, 8vw, 48px);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.02em;
}

.banban-text-h1 {
  font-family: var(--banban-font-sans);
  font-size: clamp(24px, 6vw, 32px);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.015em;
}

.banban-text-h2 {
  font-family: var(--banban-font-sans);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
}

.banban-text-body {
  font-family: var(--banban-font-sans);
  font-size: 15px;
  font-weight: 400;
  line-height: 1.6;
}

.banban-text-body-large {
  font-family: var(--banban-font-sans);
  font-size: 17px;
  font-weight: 400;
  line-height: 1.55;
}

.banban-text-caption {
  font-family: var(--banban-font-sans);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.5;
}

.banban-text-label {
  font-family: var(--banban-font-sans);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--banban-background);
    --color-foreground: var(--banban-foreground);
    --color-card: var(--banban-card);
    --color-card-foreground: var(--banban-card-foreground);
    --color-popover: var(--banban-popover);
    --color-popover-foreground: var(--banban-popover-foreground);
    --color-primary: var(--banban-primary);
    --color-primary-foreground: var(--banban-primary-foreground);
    --color-muted: var(--banban-muted);
    --color-muted-foreground: var(--banban-muted-foreground);
    --color-border: var(--banban-border);
    --color-input: var(--banban-input);
    --color-ring: var(--banban-ring);
    --radius-sm: var(--banban-radius-small);
    --radius-md: var(--banban-radius-medium);
    --radius-lg: var(--banban-radius-large);
  }
  @layer base {
    body { background: var(--banban-background); color: var(--banban-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--banban-background); }
      .text-background { color: var(--banban-background); }
      .border-background { border-color: var(--banban-background); }
      .ring-background { --tw-ring-color: var(--banban-background); }
      .bg-foreground { background-color: var(--banban-foreground); }
      .text-foreground { color: var(--banban-foreground); }
      .border-foreground { border-color: var(--banban-foreground); }
      .ring-foreground { --tw-ring-color: var(--banban-foreground); }
      .bg-card { background-color: var(--banban-card); }
      .text-card { color: var(--banban-card); }
      .border-card { border-color: var(--banban-card); }
      .ring-card { --tw-ring-color: var(--banban-card); }
      .bg-card-foreground { background-color: var(--banban-card-foreground); }
      .text-card-foreground { color: var(--banban-card-foreground); }
      .border-card-foreground { border-color: var(--banban-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--banban-card-foreground); }
      .bg-popover { background-color: var(--banban-popover); }
      .text-popover { color: var(--banban-popover); }
      .border-popover { border-color: var(--banban-popover); }
      .ring-popover { --tw-ring-color: var(--banban-popover); }
      .bg-popover-foreground { background-color: var(--banban-popover-foreground); }
      .text-popover-foreground { color: var(--banban-popover-foreground); }
      .border-popover-foreground { border-color: var(--banban-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--banban-popover-foreground); }
      .bg-primary { background-color: var(--banban-primary); }
      .text-primary { color: var(--banban-primary); }
      .border-primary { border-color: var(--banban-primary); }
      .ring-primary { --tw-ring-color: var(--banban-primary); }
      .bg-primary-foreground { background-color: var(--banban-primary-foreground); }
      .text-primary-foreground { color: var(--banban-primary-foreground); }
      .border-primary-foreground { border-color: var(--banban-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--banban-primary-foreground); }
      .bg-muted { background-color: var(--banban-muted); }
      .text-muted { color: var(--banban-muted); }
      .border-muted { border-color: var(--banban-muted); }
      .ring-muted { --tw-ring-color: var(--banban-muted); }
      .bg-muted-foreground { background-color: var(--banban-muted-foreground); }
      .text-muted-foreground { color: var(--banban-muted-foreground); }
      .border-muted-foreground { border-color: var(--banban-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--banban-muted-foreground); }
      .bg-border { background-color: var(--banban-border); }
      .text-border { color: var(--banban-border); }
      .border-border { border-color: var(--banban-border); }
      .ring-border { --tw-ring-color: var(--banban-border); }
      .bg-input { background-color: var(--banban-input); }
      .text-input { color: var(--banban-input); }
      .border-input { border-color: var(--banban-input); }
      .ring-input { --tw-ring-color: var(--banban-input); }
      .bg-ring { background-color: var(--banban-ring); }
      .text-ring { color: var(--banban-ring); }
      .border-ring { border-color: var(--banban-ring); }
      .ring-ring { --tw-ring-color: var(--banban-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      .pb-safe { padding-bottom: var(--banban-safe-bottom); }
    </style>
</head>
<body class="min-h-screen bg-background font-sans antialiased">
  <main class="min-h-screen w-full px-6 pb-44 pt-8">
    <!-- Progress header -->
    <section class="mb-8" aria-label="进度">
      <div class="flex items-center justify-between mb-3">
        <span class="banban-text-caption text-muted-foreground">步骤 2/4</span>
        <span class="banban-text-caption text-primary">50%</span>
      </div>
      <div class="h-1.5 w-full overflow-hidden rounded-full bg-muted">
        <div class="h-full w-2/4 rounded-full bg-primary"></div>
      </div>
      <h1 class="banban-text-h1 mt-5 text-foreground">生活方式</h1>
      <p class="banban-text-body mt-1 text-muted-foreground">了解你的日常习惯，找到更契合的搭伴</p>
    </section>

    <!-- Form -->
    <form class="space-y-6" autocomplete="off" onsubmit="event.preventDefault();">
      <div class="space-y-2">
        <span class="banban-text-label text-foreground">是否吸烟</span>
        <div class="grid grid-cols-3 gap-2 rounded-lg border border-border bg-input p-1" role="radiogroup" aria-label="是否吸烟">
          <button type="button" data-dom-id="smoking-yes" aria-pressed="false" class="radio-btn banban-text-body-large rounded-md py-2.5 text-center font-medium transition-colors text-muted-foreground hover:bg-muted hover:text-foreground">
            是
          </button>
          <button type="button" data-dom-id="smoking-no" aria-pressed="false" class="radio-btn banban-text-body-large rounded-md py-2.5 text-center font-medium transition-colors text-muted-foreground hover:bg-muted hover:text-foreground">
            否
          </button>
          <button type="button" data-dom-id="smoking-occasionally" aria-pressed="false" class="radio-btn banban-text-body-large rounded-md py-2.5 text-center font-medium transition-colors text-muted-foreground hover:bg-muted hover:text-foreground">
            偶尔
          </button>
        </div>
      </div>

      <div class="space-y-2">
        <span class="banban-text-label text-foreground">是否饮酒</span>
        <div class="grid grid-cols-3 gap-2 rounded-lg border border-border bg-input p-1" role="radiogroup" aria-label="是否饮酒">
          <button type="button" data-dom-id="drinking-yes" aria-pressed="false" class="radio-btn banban-text-body-large rounded-md py-2.5 text-center font-medium transition-colors text-muted-foreground hover:bg-muted hover:text-foreground">
            是
          </button>
          <button type="button" data-dom-id="drinking-no" aria-pressed="false" class="radio-btn banban-text-body-large rounded-md py-2.5 text-center font-medium transition-colors text-muted-foreground hover:bg-muted hover:text-foreground">
            否
          </button>
          <button type="button" data-dom-id="drinking-occasionally" aria-pressed="false" class="radio-btn banban-text-body-large rounded-md py-2.5 text-center font-medium transition-colors text-muted-foreground hover:bg-muted hover:text-foreground">
            偶尔
          </button>
        </div>
      </div>

      <div class="space-y-2">
        <span class="banban-text-label text-foreground">睡眠习惯</span>
        <div class="grid grid-cols-3 gap-2 rounded-lg border border-border bg-input p-1" role="radiogroup" aria-label="睡眠习惯">
          <button type="button" data-dom-id="sleep-early" aria-pressed="false" class="radio-btn banban-text-body-large rounded-md py-2.5 text-center font-medium transition-colors text-muted-foreground hover:bg-muted hover:text-foreground">
            早睡早起
          </button>
          <button type="button" data-dom-id="sleep-late" aria-pressed="false" class="radio-btn banban-text-body-large rounded-md py-2.5 text-center font-medium transition-colors text-muted-foreground hover:bg-muted hover:text-foreground">
            晚睡晚起
          </button>
          <button type="button" data-dom-id="sleep-irregular" aria-pressed="false" class="radio-btn banban-text-body-large rounded-md py-2.5 text-center font-medium transition-colors text-muted-foreground hover:bg-muted hover:text-foreground">
            不规律
          </button>
        </div>
      </div>

      <div class="space-y-2">
        <span class="banban-text-label text-foreground">宠物偏好</span>
        <div class="flex flex-wrap gap-2" role="group" aria-label="宠物偏好">
          <button type="button" data-dom-id="pet-cat" aria-pressed="false" class="tag-btn banban-text-body-large rounded-full border border-border bg-card px-4 py-2 font-medium transition-colors text-muted-foreground hover:border-primary hover:text-primary">
            猫
          </button>
          <button type="button" data-dom-id="pet-dog" aria-pressed="false" class="tag-btn banban-text-body-large rounded-full border border-border bg-card px-4 py-2 font-medium transition-colors text-muted-foreground hover:border-primary hover:text-primary">
            狗
          </button>
          <button type="button" data-dom-id="pet-none" aria-pressed="false" class="tag-btn banban-text-body-large rounded-full border border-border bg-card px-4 py-2 font-medium transition-colors text-muted-foreground hover:border-primary hover:text-primary">
            无
          </button>
          <button type="button" data-dom-id="pet-other" aria-pressed="false" class="tag-btn banban-text-body-large rounded-full border border-border bg-card px-4 py-2 font-medium transition-colors text-muted-foreground hover:border-primary hover:text-primary">
            其他
          </button>
        </div>
      </div>
    </form>
  </main>

  <!-- Bottom fixed action area -->
  <div class="fixed bottom-0 left-0 right-0 z-10 border-t border-border bg-card pb-safe shadow-[var(--banban-shadow-2)]">
    <div class="mx-auto flex w-full max-w-md items-center justify-between px-6 py-4">
      <div class="flex items-center gap-2" aria-label="步骤指示">
        <span class="h-2 w-2 rounded-full bg-primary"></span>
        <span class="h-2 w-2 rounded-full bg-primary"></span>
        <span class="h-2 w-2 rounded-full bg-muted"></span>
        <span class="h-2 w-2 rounded-full bg-muted"></span>
      </div>
      <div class="flex items-center gap-3">
        <button type="button" data-dom-id="btn-prev" class="inline-flex items-center justify-center gap-1 rounded-full border border-primary bg-card px-5 py-3 banban-text-body-large font-medium text-primary transition-colors active:bg-[var(--banban-primary-50)] focus:outline-none focus:ring-2 focus:ring-ring/40">
          <i data-lucide="chevron-left" class="h-5 w-5"></i>
          上一步
        </button>
        <button type="button" data-dom-id="btn-next" class="inline-flex items-center justify-center gap-2 rounded-full bg-primary px-7 py-3 banban-text-body-large font-medium text-primary-foreground transition-colors active:bg-[var(--banban-primary-600)] focus:outline-none focus:ring-2 focus:ring-ring/40">
          下一步
          <i data-lucide="chevron-right" class="h-5 w-5"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      lucide.createIcons();

      function activateOnly(group, activeBtn) {
        group.forEach(function (btn) {
          btn.setAttribute('aria-pressed', 'false');
          btn.classList.remove('bg-primary', 'text-primary-foreground');
          btn.classList.add('text-muted-foreground', 'hover:bg-muted', 'hover:text-foreground');
        });
        activeBtn.setAttribute('aria-pressed', 'true');
        activeBtn.classList.remove('text-muted-foreground', 'hover:bg-muted', 'hover:text-foreground');
        activeBtn.classList.add('bg-primary', 'text-primary-foreground');
      }

      function toggleTag(btn) {
        var pressed = btn.getAttribute('aria-pressed') === 'true';
        btn.setAttribute('aria-pressed', pressed ? 'false' : 'true');
        if (pressed) {
          btn.classList.remove('border-primary', 'bg-primary', 'text-primary-foreground');
          btn.classList.add('border-border', 'bg-card', 'text-muted-foreground', 'hover:border-primary', 'hover:text-primary');
        } else {
          btn.classList.remove('border-border', 'bg-card', 'text-muted-foreground', 'hover:border-primary', 'hover:text-primary');
          btn.classList.add('border-primary', 'bg-primary', 'text-primary-foreground');
        }
      }

      document.querySelectorAll('[role="radiogroup"]').forEach(function (group) {
        var buttons = group.querySelectorAll('.radio-btn');
        buttons.forEach(function (btn) {
          btn.addEventListener('click', function () {
            activateOnly(buttons, btn);
          });
        });
      });

      document.querySelectorAll('.tag-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          toggleTag(btn);
        });
      });
    })();
  </script>
</body>
</html>
